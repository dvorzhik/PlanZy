<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}{{ title or app_name }}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef4ff',
                            100: '#d9e6ff',
                            500: '#3b6fe0',
                            600: '#2f5cc4',
                            700: '#274ba1',
                        },
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                },
            },
        };
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800 antialiased">
    <header class="bg-white border-b border-slate-200">
        <div class="mx-auto max-w-3xl px-4 py-3 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 font-semibold text-brand-700">
                <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-brand-500 text-white text-lg">♞</span>
                <span>{{ app_name }}</span>
            </a>
            <span class="text-xs text-slate-400">ассистент тренера</span>
        </div>
    </header>

    <main class="mx-auto max-w-3xl px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="mx-auto max-w-3xl px-4 pb-8 pt-2 text-center text-xs text-slate-400">
        {{ app_name }} · страница доступна только по персональной ссылке
    </footer>
</body>
</html>
