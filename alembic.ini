# Конфигурация Alembic для PlanZy
# URL базы данных берётся из .env через env.py, здесь не задаётся.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Путь к файлу с URL БД (переопределяется в env.py из настроек приложения)
sqlalchemy.url =

[post_write_hooks]
# Автоформатирование миграций через ruff (опционально)
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
