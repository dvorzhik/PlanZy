# ============================================================
# PlanZy — конфиг Nginx (reverse proxy)
#
# Установка:
#   sudo cp deploy/nginx-planzy.conf /etc/nginx/sites-available/planzy
#   sudo ln -s /etc/nginx/sites-available/planzy /etc/nginx/sites-enabled/planzy
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL-сертификат добавляется автоматически утилитой certbot
# (см. deploy/README.md, шаг 9.7).
# ============================================================

upstream planzy_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name planzy.dvorzhik.site;

    # ACME-челлендж для Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name planzy.dvorzhik.site;

    # --- SSL (заполняется certbot) ---
    ssl_certificate     /etc/letsencrypt/live/planzy.dvorzhik.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planzy.dvorzhik.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Безопасность ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Логи ---
    access_log /var/log/nginx/planzy.access.log;
    error_log  /var/log/nginx/planzy.error.log;

    client_max_body_size 2m;

    # --- Статика (отдаётся напрямую, минуя приложение) ---
    location /static/ {
        alias /opt/planzy/app/web/static/;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # --- Основное приложение ---
    location / {
        proxy_pass http://planzy_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering on;
    }

    # --- Health-check без логирования ---
    location = /health {
        proxy_pass http://planzy_app;
        proxy_set_header Host $host;
        access_log off;
    }
}
