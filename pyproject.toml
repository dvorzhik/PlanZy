[project]
name = "planzy"
version = "0.1.0"
description = "PlanZy — ассистент преподавателя и тренера: логи уроков, абонементы, заметки и напоминания в WhatsApp"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "PlanZy" }]

dependencies = [
    # Веб-фреймворк и ASGI-сервер
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Telegram-бот
    "aiogram>=3.15.0",
    # База данных
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    # LLM-парсер
    "google-genai>=1.0.0",
    # Планировщик
    "apscheduler>=3.10.4",
    # Шаблоны и валидация
    "jinja2>=3.1.4",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Разбор form-data в веб-кабинете (FastAPI Form(...))
    "python-multipart>=0.0.20",
    # HTTP-клиент
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
